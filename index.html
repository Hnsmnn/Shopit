<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f8a5b">
  <meta name="description" content="Einkaufsliste mit Gerichten und Standardeinkäufen">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shopit">
  <title>Shopit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Shopit</h1>
  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-view="list"><span class="ico">🛒</span><span>Liste</span></button>
    <button data-view="recipe"><span class="ico">🍲</span><span>Gerichte</span></button>
    <button data-view="standard"><span class="ico">📦</span><span>Standards</span></button>
    <button data-view="settings"><span class="ico">⚙️</span><span>Mehr</span></button>
  </nav>
  <div id="toast" role="status"></div>
  <script src="categories.js"></script>
  <script src="recipes-vegan.js"></script>
  <script src="import.js"></script>
  <script src="ocr.js"></script>
  <script src="app.js"></script>
</body>
</html>
